<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NGW layer filtering</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      .filter-panel {
        background: #fff;
        padding: 12px;
        min-width: 260px;
        font-family: sans-serif;
      }

      .filter-panel h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .filter-panel label {
        display: block;
        margin: 0 0 4px;
        font-size: 13px;
      }

      .filter-panel select,
      .filter-panel input {
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 10px;
        padding: 6px 8px;
        font-size: 14px;
      }
    </style>

  </head>
  <body>
    <div id="map"></div>
<script type="module" src="./index.ts"></script>
  </body>
</html>
