<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>React feature identification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body, #root, .map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      body { font: 14px/1.5 sans-serif; }
      .identify-panel {
        width: min(260px, calc(100vw - 64px));
        max-height: 80vh;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 12px;
        background: rgba(255, 255, 255, 0.93);
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.15);
        border-radius: 4px;
        text-align: left;
      }
      .identify-panel h1 { margin: 0 0 8px; font-size: 18px; }
      .identify-panel select { width: 100%; padding: 5px; }
      .identify-panel dl { margin: 12px 0 0; }
      .identify-panel dt { font-weight: bold; overflow-wrap: anywhere; }
      .identify-panel dd { margin: 0 0 8px; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
