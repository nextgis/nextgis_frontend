<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vector popup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body, #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      .popup-table {
        width: 100%;
        border-collapse: collapse;
      }

      .popup-header {
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
      }

      .popup-description {
        margin-top: 10px;
        padding: 4px;
        font-size: 0.9rem;
        color: #555;
        background-color: #f7f7f7;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script type="importmap">
      {
        "imports": {
          "@nextgis/ngw-leaflet": "../../../packages/ngw-leaflet/lib/ngw-leaflet.esm-browser.js"
        }
      }
    </script>

    <script type="module" src="./index.js"></script>
  </body>
</html>
