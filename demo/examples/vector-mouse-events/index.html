<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vector layer mouse events</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #wrapper,
      #log,
      #map {
        width: 100%;
        height: 100%;
      }
      #wrapper {
        display: flex;
      }
      #log {
        overflow: scroll;
        width: 400px;
        font-family: monospace;
      }
      #log :nth-child(-n + 3) {
        color: green;
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <div id="map"></div>
      <div id="log"></div>
    </div>
<script type="module" src="./index.ts"></script>
  </body>
</html>
