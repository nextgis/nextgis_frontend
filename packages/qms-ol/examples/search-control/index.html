<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QMS control with OpenLayers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css"
    />
    <link rel="stylesheet" href="../../lib/qms-ol.css" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
    <script src="../../lib/qms-ol.global.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const map = new ol.Map({
        target: 'map',
        view: new ol.View({ center: ol.proj.fromLonLat([0, 20]), zoom: 2 }),
      });

      const control = QmsOl.createQmsControl({
        initialLayer: 448,
        // Or register a layer that is already added to the map:
        // initialLayer: () => existingLayer,
        // search: false,
        // catalog: false,
        // closeOnSelect: true,
        // lang: 'ru',
        // limit: 20,
      });
      map.addControl(control);
    </script>
  </body>
</html>
