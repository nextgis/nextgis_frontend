<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QMS OpenLayers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css"
    />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #service {
        position: absolute;
        z-index: 1;
        top: 12px;
        left: 48px;
        padding: 6px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
    <script src="../../lib/qms-ol.global.js"></script>
  </head>
  <body>
    <select id="service">
      <option data-qms-id="448">TMS</option>
      <option data-qms-id="2589">WMS</option>
    </select>
    <div id="map"></div>
    <script>
      const map = new ol.Map({
        target: 'map',
        view: new ol.View({ center: ol.proj.fromLonLat([0, 20]), zoom: 2 }),
      });
      const serviceSelect = document.getElementById('service');
      let activeLayer;

      async function showService() {
        if (activeLayer) {
          map.removeLayer(activeLayer);
        }
        const qmsId = Number(serviceSelect.selectedOptions[0].dataset.qmsId);
        activeLayer = await QmsOl.addQmsLayer(map, qmsId);
      }

      serviceSelect.addEventListener('change', showService);
      showService();
    </script>
  </body>
</html>
