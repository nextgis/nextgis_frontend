<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fit to QMS service with OpenLayers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css"
    />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #fit {
        position: absolute;
        z-index: 1;
        top: 12px;
        left: 48px;
        padding: 6px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
    <script src="../../lib/qms-ol.global.js"></script>
  </head>
  <body>
    <button id="fit">Fit to service extent</button>
    <div id="map"></div>
    <script>
      const qmsId = 4646;
      const map = new ol.Map({
        target: 'map',
      });

      QmsOl.addQmsLayer(map, qmsId, { fit: true });
      document.getElementById('fit').addEventListener('click', () => {
        QmsOl.fitQmsService(map, qmsId);
      });
    </script>
  </body>
</html>
