<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Initialize map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body,
      .map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      .grid-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        height: 100%;
        gap: 1px;
      }
      .map-container {
        border: 1px solid #ccc;
        box-sizing: border-box;
        position: relative;
      }
      .map-label {
        position: absolute;
        bottom: 0;
        left: 0;
        background: rgba(255, 255, 255, 0.7);
        padding: 5px;
        font-size: 0.8em;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="map-container">
        <div class="map-label">Zoom: 10, Center: Paris</div>
        <div id="map1" class="map"></div>
      </div>
      <div class="map-container">
        <div class="map-label">Bounds: Venice</div>
        <div id="map2" class="map"></div>
      </div>
      <div class="map-container">
        <div class="map-label">Zoom: 12, MaxBounds: NYC</div>
        <div id="map3" class="map"></div>
      </div>
      <div class="map-container">
        <div class="map-label">Zoom: 11, Min/MaxZoom: 8/16, Center: Moscow</div>
        <div id="map4" class="map"></div>
      </div>
      <div class="map-container">
        <div class="map-label">Zoom: 14, MaxBounds: London</div>
        <div id="map5" class="map"></div>
      </div>
      <div class="map-container">
        <div class="map-label">World Overview Map</div>
        <div id="map6" class="map"></div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@nextgis/ngw-maplibre-gl": "../../lib/ngw-maplibre-gl.esm-browser.js"
        }
      }
    </script>

    <script type="module" src="./index.js"></script>
  </body>
</html>
