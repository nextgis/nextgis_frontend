<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Control panel with nested controls</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="importmap">
      {
        "imports": {
          "@nextgis/ngw-maplibre-gl": "../../lib/ngw-maplibre-gl.esm-browser.js"
        }
      }
    </script>

    <script type="module">
      import NgwMap from '@nextgis/ngw-maplibre-gl';
      const ngwMap = new NgwMap({
        target: 'map',
        center: [0, 0],
        zoom: 2,
        controls: ['ZOOM', 'ATTRIBUTION'],
      });

      ngwMap.onLoad().then(() => {
        let index = 0;
        const positions = [
          ['top-left', 'start'],
          ['top-right', 'end'],
          ['bottom-left', 'start'],
          ['bottom-right', 'end'],
        ];

        const nextLabel = () => String.fromCharCode(65 + index++);

        const createPanel = (options) => {
          return ngwMap.createControl(
            {
              onAdd: () => undefined,
              onRemove: () => {},
            },
            options,
          );
        };

        const createButton = (label) => {
          return ngwMap.createButtonControl({
            html: label,
            title: 'Button ' + label,
            onClick: () => {},
          });
        };

        const createToggle = (label, options = {}) => {
          return ngwMap.createToggleControl({
            status: options.status ?? true,
            html: options.switch
              ? { on: label, off: label.toLowerCase() }
              : label,
            title: 'Toggle ' + label,
            switch: options.switch,
            onClick: (status) => {console.log(`${label}: ${status}`)}
          });
        };

        const textBar = ngwMap.createControl(
          {
            onAdd: () => {
              const textContent = document.createElement('div');
              textContent.style.margin = '10px';
              textContent.innerHTML = 'Controls layout test';
              return textContent;
            },
            onRemove: () => {},
          },
          { bar: true, margin: true },
        );

        ngwMap.addControl(textBar, 'top-left', { order: -1 });

        positions.forEach(([position, align]) => {
          const standaloneButtonLabel = nextLabel();
          const horizontalToggleLabel = nextLabel();
          const horizontalSwitchLabel = nextLabel();
          const verticalButtonLabel = nextLabel();
          const verticalToggleLabel = nextLabel();
          const standaloneToggleLabel = nextLabel();

          const id = position + '-control-panel';
          const horizontalId = position + '-horizontal-panel';
          const verticalId = position + '-vertical-panel';

          const mainPanel = createPanel({
            orientation: 'vertical',
            align,
            gap: 8,
            margin: true,
          });
          const horizontalPanel = createPanel({
            orientation: 'horizontal',
            gap: 0,
          });
          const verticalPanel = createPanel({
            orientation: 'vertical',
            gap: 0,
          });

          ngwMap.addControl(
            createToggle(standaloneToggleLabel),
            position,
            {
              order: 30,
            },
          );
          ngwMap.addControl(mainPanel, position, {
            id,
            order: 20,
          });
          ngwMap.addControl(
            createButton(standaloneButtonLabel),
            position,
            {
              order: 10,
            },
          );

          ngwMap.addControl(verticalPanel, { inside: id }, {
            id: verticalId,
            order: 20,
          });
          ngwMap.addControl(horizontalPanel, { inside: id }, {
            id: horizontalId,
            order: 10,
          });

          ngwMap.addControl(
            createToggle(horizontalSwitchLabel, {
              switch: true,
              status: false,
            }),
            { inside: horizontalId },
            { order: 20 },
          );
          ngwMap.addControl(
            createToggle(horizontalToggleLabel, {
              switch: true,
              status: true,
            }),
            { inside: horizontalId },
            { order: 10 },
          );

          ngwMap.addControl(
            createToggle(verticalToggleLabel),
            { inside: verticalId },
            { order: 20 },
          );
          ngwMap.addControl(
            createButton(verticalButtonLabel),
            { inside: verticalId },
            { order: 10 },
          );
        });
      });
    </script>
  </body>
</html>
