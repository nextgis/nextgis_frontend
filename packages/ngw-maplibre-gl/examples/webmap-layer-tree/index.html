<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />

    <title>Ngw WebMap Tree</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #wrap,
      #map {
        width: 100%;
        height: 100%;
      }
      #wrap {
        display: flex;
      }
      #tree {
        width: 35%;
        min-width: 300px;
        overflow: auto;
      }
      .tree-container__item {
        padding-top: 0.3rem;
      }
      .tree-container__item input {
        margin-right: 3px;
      }
      .tree-container__item-children {
        padding: 0;
        padding-top: 3px;
        padding-left: 15px;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="tree"></div>
      <div id="map"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@nextgis/ngw-maplibre-gl": "../../lib/ngw-maplibre-gl.esm-browser.js"
        }
      }
    </script>

    <script type="module" src="./index.js"></script>
  </body>
</html>
