<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NGW Legend Symbol Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      .legend-container {
        background-color: white;
        padding: 10px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }
      .legend-item img {
        margin-right: 10px;
        cursor: pointer;
      }
      .legend-item img.disabled {
        opacity: 0.3;
      }
      .layer-section {
        margin-bottom: 15px;
      }
      .layer-title {
        display: flex;
        align-items: center;
        margin-bottom: 5px;
      }
      .layer-title input[type='checkbox'] {
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script type="importmap">
      {
        "imports": {
          "@nextgis/ngw-maplibre-gl": "../../lib/ngw-maplibre-gl.esm-browser.js"
        }
      }
    </script>

    <script type="module" src="./index.js"></script>
  </body>
</html>
