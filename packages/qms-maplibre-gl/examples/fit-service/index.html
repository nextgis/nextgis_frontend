<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fit to QMS service with MapLibre GL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #fit {
        position: absolute;
        z-index: 1;
        top: 12px;
        left: 48px;
        padding: 6px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="../../lib/qms-maplibre-gl.global.js"></script>
  </head>
  <body>
    <button id="fit">Fit to service extent</button>
    <div id="map"></div>
    <script>
      const qmsId = 4646;
      const map = new maplibregl.Map({
        container: 'map',
        style: { version: 8, sources: {}, layers: [] },
      });
      map.addControl(new maplibregl.NavigationControl(), 'top-left');

      map.on('load', () =>
        QmsMaplibreGL.addQmsLayer(map, qmsId, { fit: true }),
      );
      document.getElementById('fit').addEventListener('click', () => {
        QmsMaplibreGL.fitQmsService(map, qmsId);
      });
    </script>
  </body>
</html>
