<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QMS control with MapLibre GL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="../../lib/qms-maplibre-gl.css" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="../../lib/qms-maplibre-gl.global.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const map = new maplibregl.Map({
        container: 'map',
        style: { version: 8, sources: {}, layers: [] },
        center: [0, 20],
        zoom: 2,
      });
      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      const control = QmsMaplibreGL.createQmsControl({
        initialLayer: 448,
        // Or register a layer that is already added to the map:
        // initialLayer: () => existingLayer,
        // search: false,
        // catalog: false,
        // closeOnSelect: true,
        // lang: 'it',
        // limit: 20,
      });
      map.addControl(control, 'top-left');
    </script>
  </body>
</html>
