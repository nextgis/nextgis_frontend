<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QMS MapLibre GL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #service {
        position: absolute;
        z-index: 1;
        top: 12px;
        left: 48px;
        padding: 6px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="../../lib/qms-maplibre-gl.global.js"></script>
  </head>
  <body>
    <select id="service">
      <option data-qms-id="448">TMS</option>
      <option data-qms-id="2589">WMS</option>
    </select>
    <div id="map"></div>
    <script>
      const map = new maplibregl.Map({
        container: 'map',
        style: { version: 8, sources: {}, layers: [] },
        center: [0, 20],
        zoom: 2,
      });
      map.addControl(new maplibregl.NavigationControl(), 'top-right');
      const serviceSelect = document.getElementById('service');
      let activeLayer;

      async function showService() {
        if (activeLayer) {
          activeLayer.remove();
        }
        const qmsId = Number(serviceSelect.selectedOptions[0].dataset.qmsId);
        activeLayer = await QmsMaplibreGL.addQmsLayer(map, qmsId);
      }

      serviceSelect.addEventListener('change', showService);
      map.on('load', showService);
    </script>
  </body>
</html>
