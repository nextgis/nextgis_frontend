<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QMS control with Leaflet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.7.1/dist/leaflet.css"
    />
    <link rel="stylesheet" href="../../lib/qms-leaflet.css" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="../../lib/qms-leaflet.global.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const map = L.map('map').setView([20, 0], 2);

      const control = QmsLeaflet.createQmsControl({
        initialLayer: 448,
        // Or register a layer that is already added to the map:
        // initialLayer: () => existingLayer,
        // position: 'topright',
        // search: false,
        // catalog: false,
        // closeOnSelect: true,
        // lang: 'it',
        // limit: 20,
      });
      control.addTo(map);
    </script>
  </body>
</html>
