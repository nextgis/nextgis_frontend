<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vector events with bounds and center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      .popup-content {
        font-family: Arial, sans-serif;
        font-size: 14px;
      }
      .popup-title {
        font-weight: bold;
        margin-bottom: 5px;
      }
      .popup-btn {
        display: block;
        margin-top: 10px;
        padding: 6px 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .popup-btn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>

    <div id="map"></div>

    <script type="importmap">
      {
        "imports": {
          "@nextgis/ngw-ol": "../../lib/ngw-ol.esm-browser.js"
        }
