<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NGW Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #wrap {
        display: flex;
        height: 100%;
      }
      #tree {
        width: 35%;
        min-width: 300px;
        overflow: auto;
        height: 100%;
      }
      #map {
        flex-grow: 1;
        height: 100%;
      }
      .tree-container__item {
        padding: 2px;
      }
      .tree-container__item-children {
        padding: 0;
        padding-left: 15px;
      }
      .tree-container__item-btn {
        display: inline-block;
        width: 20px;
        text-align: center;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="tree"></div>
      <div id="map"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@nextgis/ngw-ol": "../../lib/ngw-ol.esm-browser.js",
          "@nextgis/ngw-kit": "../../../ngw-kit/lib/ngw-kit.esm-browser.js"
        }
      }
    </script>

    <script type="module" src="./index.js"></script>
  </body>
</html>
