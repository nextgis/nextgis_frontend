<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Events</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body, #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      .log {
        background: white;
        padding: 4px;
      }
      .event-log {
        color: red;
      }
      .event-log.ok {
        color: green;
      }
      .event-log.action {
        background: greenyellow;
        color: black;
        transition: background 0.7s;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script type="importmap">
      {
        "imports": {
          "@nextgis/ngw-ol": "../../lib/ngw-ol.esm-browser.js"
        }
      }
    </script>

    <script type="module" src="./index.js"></script>
  </body>
</html>
