<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ngw Layers Resources</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #wrapper,
      #map {
        width: 100%;
        height: 100%;
      }
      #wrapper {
        display: flex;
      }
      #layers {
        min-width: 280px;
        overflow: auto;
      }
      #layers > div {
        padding: 10px;
      }
      #layers > :nth-child(odd) {
        background: rgba(0, 0, 0, 0.1);
      }
      #layers label {
        font-weight: 700;
        margin-left: 3px;
      }
      .description {
        margin-left: 13px;
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <div id="layers"></div>
      <div id="map"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@nextgis/ngw-ol": "../../lib/ngw-ol.esm-browser.js"
        }
      }
    </script>

    <script type="module" src="./index.js"></script>
  </body>
</html>
