<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Zoom to NGW Layer Feature</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #wrapper,
      #map {
        width: 100%;
        height: 100%;
      }
      #wrapper {
        display: flex;
      }
      #feature-list {
        min-width: 280px;
        overflow: auto;
      }
      #feature-list div {
        padding: 5px 10px;
      }
      .item-block {
        cursor: pointer;
      }
      .item-block:hover {
        background-color: lightgray;
      }
      .pagination-block-item {
        display: inline-block;
        cursor: pointer;
      }
    </style>
    <!-- Note: For production environments, consider using a build system and ESM modules for better performance and maintainability.-->
    <!-- This approach is suitable for demonstration purposes only. -->
  </head>
  <body>
    <div id="wrapper">
      <div id="feature-list">Loading features...</div>
      <div id="map"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@nextgis/ngw-ol": "../../lib/ngw-ol.esm-browser.js",
          "@nextgis/ngw-connector": "../../../ngw-connector/lib/ngw-connector.esm-browser.js",
          "@nextgis/ngw-kit": "../../../ngw-kit/lib/ngw-kit.esm-browser.js"
        }
      }
    </script>

    <script type="module" src="./index.js"></script>
  </body>
</html>
